spec:
  id: 'spec_E6_solver_O8'
  purpose: 'define the O8 solver used by every NMPC arm of E6 (B, MLP, C1 to C6): unknowns, prediction, cost, constraints, gradient, fmincon settings, warm start, failure rule; define before any code the equivalence test against nlmpcmove on arm B, the gradient check, the fallback criteria and the protocol of the O8 cost measurement'
  author_decisions:
    formulation: 'O8 main formulation, O9 declared fallback, O2 last resort (author adoption relayed on 02/11/2026, recorded by the supervisor on 02/11/2026)'
    E5_loss: 'one-step loss, the same for the six families; multi-step loss and physics penalty are declared extensions after E5; no amendment of spec_E5 (spec_E5 framework_decisions.loss, l.32: the multi-step prediction is evaluated, not trained)'
    E6_runs: '7 runs per NMPC arm: the seven mean speeds 12 to 24 m/s, one seed each (author decision of 03/11/2026); a limit declared: one turbulence realisation per speed in E6, E6 being the integration step and E7 the evaluation (spec_E6 draft 1 E7_role)'
    E6_budget: 'the E6 budget is fixed from cost tests and not a priori (author decision of 03/11/2026: tests to fix a realistic and defensible budget); the 72 h in total given on 02/11/2026 is no longer a ceiling; rule: fallback_criteria.F3_campaign_cost.budget_rule'
    exceeding_family: 'option (a) of fallback_criteria.F3_campaign_cost.exceeding_family (supervisor recommendation of 02/11/2026); author answer of 02/11/2026, recorded by the supervisor on 03/11/2026'
    campaign_organisation: 'author decision of 02/11/2026 as stated in the supervisor message of 02/11/2026: launches arm by arm (campaign_organisation)'
    C_arm: '16 h per NMPC arm, total 8 x 16 = 128 h, author decision of 13/11/2026 (amendment 6), fallback_criteria.F3_campaign_cost.budget_rule step (1), taken on cost only, before any E5 training; estimates on which it is taken: T_arm of measurement (i) (results/work_Q1/2026-11-12_O8_measurement_i_run/measurement_i_O8.txt sha256 9bf5b92cb838916735d7e2a941126921be347a7aeb8d3c7081b73a719e75b034): B 8.699, C5 29.549, MLP numerical 3.116 and supplied 2.823, C6 numerical 3.841 and supplied 3.230, C3 1 x 16 2.209, C1 supplied 3.458 and numerical 37.314, C2 34.549, C4 3.071, C3 2 x 128 20.867 h; and T_arm of B from the replay of cost_measurement_protocol.amendment_5 (results/work_Q1/2026-11-13_O8_measurement_ii_B_run/measurement_ii_B_O8.txt sha256 818261a7bba1aa02b9640f437f50cec35fdf69a60aa0f642300887f100c15e1d): 10.723 h; consequences in fallback_criteria.F3_campaign_cost.budget_rule_step1_record'
    torque_law_switch: 'option (a), author decision of 12/11/2026 (amendment 3), taken before measurement (i) and before any E6 run, on the result of region_switch_count: the prediction model of every NMPC arm keeps the torque law of DISCON as it is, including the switch out of region 3 when beta < VS_Rgn3MP (1 deg) and omega_f < VS_RtGnSp (rom_torque_law.m l.18, DISCON.F90 l.384), as in the simulated plant; option (b), a constraint beta >= 1 deg while omega_f < VS_RtGnSp, not retained because it changes the control problem posed (pitch forced to 1 deg below rated speed where DISCON keeps the minimum pitch) and needs a state-dependent nonlinear constraint that equivalence_test_B does not cover; option (c), a smoothed switch in the prediction only, not retained because it creates a declared model-plant difference with a new smoothing parameter; consequence: the control problem is discontinuous in the pitch, and local solvers can stop at different solutions near the switch (equivalence_test_B.amendment_2_record, region_switch_count.result)'
  supervisor_decisions: 'decisions 1 to 20 of 02/11/2026 on the TO FIX items of draft 1 and decisions 21 to 28 of 03/11/2026 on the items of draft 2, under the author delegation of 31/10/2026, written in the blocks where they apply'

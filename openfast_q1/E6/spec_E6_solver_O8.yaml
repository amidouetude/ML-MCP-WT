# E6 solver spec, option O8 - single-shooting nonlinear MPC written on fmincon for the NMPC arms of E6, with the equivalence test against nlmpcmove on arm B and the fallback criteria O8 -> O9 -> O2 fixed before any test
# STATUS: ADOPTED 03/11/2026 by the supervisor under the author delegation of 31/10/2026, with the author decisions of 02/11/2026 and 03/11/2026; built by the supervisor from draft 3 (executor, %TEMP%\spec_E6_solver_O8_draft3.yaml sha256 fce25eba7359110abd52f9c5901c52e5dfbd402116cce175f5586e4548fe2953) by the changes of the next line; committed as openfast_q1/E6/spec_E6_solver_O8.yaml before any O8 code. Drafts 1 (%TEMP%\spec_E6_solver_O8_draft1.yaml sha256 cf5d6c99d781ecac8e5fb6e625c984bb13178508dfe4406229961b96ec8b5179), 2 (%TEMP%\spec_E6_solver_O8_draft2.yaml sha256 069826e0c69bed1db9bb58273162110b076c22b9491b7c7a67f67f2fe84e8215) and 3 are kept unchanged outside the repository.
# Changes from draft 3 (supervisor, 03/11/2026): author decisions of 03/11/2026 (7 runs per arm; E6 budget fixed from cost tests instead of the 72 h set a priori on 02/11/2026); fallback_criteria.F3_campaign_cost rewritten (OpenFAST time term from the E4 records, budget rule, interruption limit per arm); cost_measurement_protocol.measurements.ii_selected by open-loop replay per speed; new block pilot_closed_loop (optional); cross_evaluation scope note; campaign_organisation.ceilings; to_fix_summary updated. The supervisor supplement of 03/11/2026 on these points was not received by the executor before draft 3.
# AMENDMENT 1, 03/11/2026 (supervisor, under the author delegation of 31/10/2026), after spec_E2 amendment 8 (commit 73c4446), whose NMPC pitch-bound margin the author accepted on 03/11/2026: constraints.values Min 0.01 deg and Max 29.99 deg (spec_E2 nmpc_interface.constraints.nmpc_arms), rates unchanged; prediction.cp_fallback refers to the NMPC mode of spec_E2 model.cp_interpolant.out_of_domain, now written; spec.depends_on.spec_E2 records the new SHA-256; the line numbers of spec_E2 cited in this spec refer to its previous version (sha256 6c09b3ef2df0d8dade7123caaa56e22c6ce248578518545793a8a44dd2d00515), whose keys are unchanged by amendment 8 except model.cp_interpolant.out_of_domain and nmpc_interface.constraints. Keys edited: spec.depends_on.spec_E2, prediction.cp_fallback, constraints.values. No code, no run, no model metric seen.
# AMENDMENT 2, 11/11/2026 (supervisor, author decision of 11/11/2026: way 2 of the supervisor review of 11/11/2026), WRITTEN AFTER THE RESULTS WERE SEEN: equivalence_test_B of the run b (FAIL, 208 of 210 points), gradient_check v1 (NOT CONFORMANT) and the two diagnostics of points 19 and 90. It corrects two design errors of this spec and does not erase any result: (1) the equivalence test assumed a smooth problem, and the torque law of model B is discontinuous at beta = 1 deg (rom_torque_law.m l.18); (2) the gradient check used a relative error per component without floor, undefined where the gradient is near zero (optimum points, supervisor decision P12 'uz_points both' of 03/11/2026), and a reference taken down to dv = 1e-10, below the nlmpc default step at which the V2 threshold applies. Keys added, no key of the text above changed: equivalence_test_B.amendment_2_record, gradient_check.amendment_2, region_switch_count, fallback_criteria.F1_amendment_2, fallback_criteria.F2_amendment_2, declared_deviation.amendment_2, to_fix_summary.author_decision_pending (one item added), forbidden_wordings (four items added). The FAIL of the run b and the NOT CONFORMANT of gradient_check v1 stay on record.

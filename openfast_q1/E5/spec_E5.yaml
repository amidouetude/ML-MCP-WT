  notions:
    fair_comparison: 'same runs, partitions, variables, targets, wind information, and normalisation fitted on the training partition only, for every family (E5.1 sections 3 and 4A, General table section 5); already in data'
    history_control: 'the MLP without history beside SW-MLP separates the effect of the history from that of the architecture (E5.1 section 3, General table section 4); already in arms.MLP'
    search_budget: 'for each family, document the explored hyperparameters, the number of trials, the random initialisations, the compute budget, the stopping rule and the selection rule on validation; unequal budgets bias the comparison (E5.1 section 4C); informs families.common'
    loss: 'squared error normalised per state, weights justified and documented, training loss kept distinct from the metrics in physical units (E5.1 section 4B, E5.3 section 2); informs families.common.loss'
    levels: 'one-step prediction, recursive multi-step prediction without re-injecting the true states, control-oriented quality in closed loop (E5.3 section 3, E5.4 section 2); the third level belongs to E6'
    physics_penalty: 'physics-informed losses belong to a separate experiment (E5.3 section 5); consistent with PINN out of scope (arms.out_of_scope)'
    record: 'per training: configuration, partitions, loss and weights, normalisation, optimiser, learning rate, batch size, stopping rule and best validation value, seeds and search budget, test metrics, training time and separately the prediction cost (E5.3 section 6); informs outputs'
    leakage: 'partition by whole runs or wind realisations, never by rows (E5.4 section 1); already in data.partition'
    physical_consistency: 'plausibility checks of the predicted trajectories (E5.4 section 3); informs evaluation_offline'
    interpolation: 'the E5 test measures interpolation on independent turbulence seeds at the seven trained mean speeds, not extrapolation (E5.4 section 4)'
    cost: 'training time, prediction time, derivative cost and full NMPC solve time are distinct; the last one exists only in closed loop (E5.1 section 4D, E5.4 section 5)'
    recurrent_memory: 'recurrent and latent-state models need a consistent memory update across the candidate input sequences of the optimiser (E5.2 section 4); informs families.C3_LSTM and E6_prerequisites.history_in_loop'
    selection: 'not the best global RMSE alone: minimum requirements first, then the trade-off between accuracy, robustness and cost, all fixed before the test (E5.4 section 6); informs evaluation_offline.selection'
  divergences:

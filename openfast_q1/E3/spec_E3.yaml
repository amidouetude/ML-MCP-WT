# E3 campaign spec - plant equivalence (exe vs S-function) and region-3 qualification of DISCON
# STATUS: ADOPTED by the author on 16/10/2026 (supervisor proposal of 16/10/2026, corrected for IECturbc, UsableTime, PLExp).
# AMENDMENT 1, 16/10/2026: commit 31742b7 held the first draft with three replacements instead of the source-verified text of the same day; the whole text is replaced by the verified version (channels and units, S-function input conversions, Q3 on mechanical power, project-choice labels, full binary hashes, DLL placement). No code had been written and nothing had been executed.
# AMENDMENT 2, 16/10/2026: Q5 compared the file SHA-256 of two .outb, which differ by construction because the .outb header records the generation date and time; Q5 now compares channel names, units and data byte for byte. A note on the informative channels of E3a is added. Nothing had been executed.
# AMENDMENT 3, 21/10/2026: E3b runs on the plant of the paper, FAST_SFunc driven by the verified DISCON wrapper (spec_E3W, W1 PASS in Q1-E3-WRAP-2026-10-21-c), with InterpOrder = 1 in the .fst copy (author choice O1 of 21/10/2026). With InterpOrder = 2 the baseline pitch loop diverged at the first pitch-command saturation event (Q1-E3-WRAP-2026-10-21-c, W2); it was stable with InterpOrder = 1 (Q1-E3-WRAP-DIAG2-2026-10-21-a, case D-a). E3a is unchanged. Nothing of E3b had been run in this configuration.
# AMENDMENT 4, 21/10/2026: amendment 3 (InterpOrder 1, measured pitch) was refuted by Q1-E3-QUAL-2026-10-21-b (19 of 22 runs unstable from the first pitch activation, mean speeds 14-24 m/s). The exploratory diagnostic Q1-E3-QUAL-DIAG-2026-10-21-a found three stable options at 16 and 22 m/s over 120 s; the pre-registered comparison Q1-E3-PATHCMP-2026-10-21-a with the executable reference retained O8 (measured pitch, InterpOrder 2, NumCrctn 1; score 1.465e-02 against 1.690e-02 for O2). E3b now runs in configuration O8.
# Rule: spec, code and analysis are committed BEFORE execution; criteria cannot be changed after
# results are seen; corrections by dated amendment in a separate commit. Long runs are launched
# by the author from a launch block given by the executor (author rule of 16/10/2026).
# Code cites this spec by key path, not by line number (author rule of 16/10/2026).

campaign:
  ids: 'Q1-E3-PLANTEQ-<date>-a (E3a) and Q1-E3-QUAL-<date>-a (E3b)'
  step: 'E3'
  depends_on:
    discon: 'results/Q1-E3-DISCON-BUILD-2026-10-09-a/build/DISCON.dll, sha256 b922907959c41a8f1fc9db8e68b43e189ce93eabff4fa0fc2da1b83d18c8671e'
    discon_placement: 'in each case copy, this DLL is copied to 5MW_Baseline/ServoData/DISCON.dll, the path named by DLL_FileName (../5MW_Baseline/ServoData/DISCON.dll) in the ServoDyn file of the model; ServoDyn is not modified for this, as in Q1-E3-DISCON-BUILD-2026-10-09-a'
    model: 'openfast_q1/model/5MW_Land_DLL_WTurb, model commit 7232a48'
    exe: 'C:/dev/openfast-bin/openfast_x64.exe, sha256 dbae80560269c00f4a1f3529b5bb3ffcd111faa6d6791f4cce6dcf321679d924'
    sfunction: 'C:/dev/openfast-bin/FAST_SFunc.mexw64 sha256 16b628c493baf4b716cfe2373f320f72f5859b38718b2dc3da455befb3112297 and OpenFAST-Simulink_x64.dll sha256 2d61ae5e72c21376d87c95489a4db22d95e4c3b3d9f1aea92a8fee6daa0d093d'
    turbsim: 'C:/dev/openfast-bin/TurbSim_x64.exe, sha256 5f70b3e2d50cbe09ad37d98569443a7d6f1b7a97c214bf21bbd9533cf2f29df2'
    wrapper: 'openfast_q1/E3/discon_wrapper.m and openfast_q1/E3/discon.h at commit 11f0133 (spec_E3W sha256 a78de8925221565c50f47ef458b60497891e21547d90d048f0cb38cd08bb0d86; W1 PASS in Q1-E3-WRAP-2026-10-21-c) (amendment 3)'
  controller_rule: 'DISCON gains and constants are those of DISCON.F90 (r-test 6fda1b18); they are never changed, whatever the result'

channels:
  required: 'Wind1VelX, RotSpeed, GenSpeed, BldPitch1, BlPitchC1, BlPitchC2, BlPitchC3, GenTq, GenPwr, TwrBsMyt, RootMyc1, RtVAvgxh, RtAeroPwr'
  verified: 'names present in the valid-parameter lists of OpenFAST v4.2.1 (InflowWind_Subs.f90 l.1193, ElastoDyn.f90 l.3772-3922, ServoDyn_IO.f90 l.1524-1572, AeroDyn_IO_Params.f90 l.2064-2067), checked 16/10/2026; the code checks them again against the OutList written by each run'
  units: 'GenTq in kN-m and GenPwr in kW (ServoDyn_IO.f90 l.788-789), BlPitchC1-3 in deg (ServoDyn_IO.f90 l.793), RotSpeed and GenSpeed in rpm, Wind1VelX in m/s at (0, 0, 90 m) per WindVziList of the model InflowWind file'
  output_format: 'OutFileFmt and DT_Out as in the model (DT_Out default = DT = 0.00625 s)'

E3a_plant_equivalence:
  wind: 'the r-test turbulent field results/Q1-E3-DISCON-BUILD-2026-10-09-a/test/5MW_Baseline/Wind/90m_12mps_twr.bts (sha256 0a368181d3dce9bdb9bb8501e395c1a943aed933098ac914334dcfcc0507d4c1), TMax 60 s'
  run_1_exe: 'openfast_x64.exe + DISCON.dll (PCMode 5, VSContrl 5), OutList extended to channels.required'
  run_2_sfunction: 'FAST_SFunc with PCMode 4, VSContrl 4; S-function inputs replayed from run 1 at every DT with unit conversion: input 1 = GenTq x 1000 (N-m), input 2 = GenPwr x 1000 (W), inputs 5-7 = BlPitchC1-3 x pi/180 (rad); all other inputs 0; no other change'
  lag_rule: 'the replay is evaluated with lag 0 and with lag 1 DT (commands of step k applied at step k+1); the retained lag is the one with the lower RMS difference of RotSpeed; both are reported'
  compared: 'RotSpeed, GenPwr, BldPitch1, TwrBsMyt, RootMyc1 over 10 to 60 s'
  metrics: 'per channel: max |diff| / (max - min of run 1), and mean |diff| / mean |run 1|'
  pass: 'for each compared channel, max |diff| / range <= 1e-2 and mean |diff| / mean |run 1| <= 1e-3, at the retained lag (project choice, no external source)'
  wording: 'pass is written CONCORDANT AT EPSILON, never identical (two different binaries)'
  note_inputs: 'GenPwr follows replayed input 2 and BldPitch1 follows replayed inputs 5-7 (no pitch actuator); the channels that test the equivalence of the two plants are RotSpeed, TwrBsMyt and RootMyc1; all five are still judged as written in pass'

E3b_region3_qualification:
  plant_configuration: 'FAST_SFunc (PCMode 4, VSContrl 4) with DISCON.dll called at every DT by the wrapper of campaign.depends_on.wrapper, which receives the measured BldPitch1 as in spec_E3W verification.W2_closed_loop; the wrapper outputs (pitch command, torque, electrical power, records 45 and 47, aviFAIL) are logged at every call in Simulink, also when OpenFAST stops; discon_wrapper.m is not modified; in the .fst copy InterpOrder = 2 (model value, unchanged) and NumCrctn 0 -> 1 (one correction iteration, .fst comment {0=explicit calculation, i.e., no corrections}); NumCrctn differs from the r-test case (0) and applies to every controller of the paper (amendment 4)'
  wind_generation: 'TurbSim from the template openfast_q1/model/5MW_Baseline/Wind/90m_12mps_twr.inp, kept as is for TurbModel IECKAI, IECstandard 1-ed3, IEC_WindType NTM, WindProfileType PL, HubHt and RefHt 90 m, GridHeight and GridWidth 145 m, TimeStep 0.05 s, RandSeed2 RanLux. Changes in the copy only: URef = mean speed; RandSeed1 = seed; IECturbc B to A (category A, choice of the project); UsableTime 60 to 660 (TurbSim then raises AnalysisTime to UsableTime + GridWidth/URef, per the template comment); PLExp default to 0.2 written explicitly (same value as PLExp in NRELOffshrBsline5MW_InflowWind_12mps.dat, the InflowWind file of the case). Nothing else changes.'
  mean_speeds: '12, 14, 16, 18, 20, 22, 24 m/s'
  seeds: 'RandSeed1 in {31001, 31002, 31003} for every speed (project choice, no external source); this set is reserved for E3 and E2 V4 and excluded from E4'
  duration: '660 s simulated, the first 60 s excluded from every statistic'
  runs: '21 (7 speeds x 3 seeds) on plant_configuration, model unchanged except the InflowWind file (WindType 3, generated .bts), TMax = 660 s and NumCrctn = 1 (amendment 4)'
  repeatability: 'the run 18 m/s seed 31001 is executed twice; Q5 passes if the channel names, the units and the channel data returned by ReadFASTbinary (class double, compared byte for byte with typecast to uint8) are identical; the file SHA-256 differs by construction because the .outb header records the generation date and time (Predictions were generated on ... at ..., read on the .outb of Q1-E3-DISCON-BUILD-2026-10-09-a and Q1-F-SIMULINK-2026-10-16-b) and is reported only'
  criteria:
    Q1_integrity: 'SHA-256 of every input (model copy, .inp, .bts, DLL, binaries, wrapper files; amendment 3) written before each run and unchanged after'
    Q2_execution: 'every run reaches TMax, all outputs finite'
    Q3_power: 'for mean speeds >= 14 m/s, per run, mean of GenTq x 1000 x GenSpeed x pi/30 (mechanical generator power, W) within VS_RtPwr = 5296610 W of DISCON.F90 +/- 2 % (tolerance: project choice, no external source)'
    Q4_overspeed: 'per run, max RotSpeed <= 1.2 x 12.1 rpm (project choice, no external source)'
    Q5_repeatability: 'see repeatability'
    reported_only: 'fraction of time in region 3, reconstructed from the outputs after the test of DISCON.F90 l.384: GenSpeedF recomputed from GenSpeed (rad/s) with the DISCON filter (Alpha = exp((LastTime - Time) x CornerFreq), l.355; GenSpeedF = (1 - Alpha) x GenSpeed + Alpha x GenSpeedF, l.360; CornerFreq = 1.570796 rad/s, l.58; initial GenSpeedF = first GenSpeed, l.303) and PitCom taken as record 45 returned by the previous DISCON call, from the wrapper log (PitCom is computed after the test, l.487-489; initial PitCom = first BldPitch1, l.304; on plant_configuration the channel BlPitchC1 is the extrapolated S-function input and not the DISCON command, as seen in Q1-E3-PLANTEQ-2026-10-16-a; amendment 3); region 3 if GenSpeedF >= VS_RtGnSp = 121.6805 rad/s (l.95) or PitCom >= VS_Rgn3MP = 0.01745329 rad (l.94); this is a reconstruction, not the internal state of DISCON. Also: fraction of time with BldPitch1 > 30 deg, mean and std of RotSpeed, mean GenPwr, wall time per run'
  domain_rule: 'a mean speed belongs to the region-3 core of the paper if its fraction of time in region 3 is >= 0.90 for every seed (project choice, no external source); the others are reported as transition speeds'
  verdict: 'QUALIFIED if Q1 to Q5 pass for all runs; QUALIFIED WITH LIMITS if Q3 or Q4 fail only at listed speeds; NOT QUALIFIED otherwise'

outputs:
  folders: 'results/Q1-E3-PLANTEQ-<date>-a/ and results/Q1-E3-QUAL-<date>-a/'
  files: 'meta, verdict, case manifests, .inp, .bts and .outb of every run, wrapper log of every run (time, pitch command, torque, electrical power, records 45 and 47, aviFAIL), summary CSV per run, console log next to each folder (amendment 3)'
  registry: 'no value enters the values registry from E3 until a manuscript sentence needs it (rule b)'

forbidden_wordings:
  - 'the two plants are identical'
  - 'DISCON was validated'
  - 'real time'
  - 'the region-3 domain is 12-24 m/s, before domain_rule is applied'
  - 'NumCrctn 1 is the r-test setting'

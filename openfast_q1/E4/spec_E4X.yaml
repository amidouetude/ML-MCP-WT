# E4X exploratory spec - entry point of the pitch excitation for the E4 dataset
# STATUS: DRAFT 3 (supervisor, 24/10/2026, executor remarks R1-R7 of 23-24/10/2026 applied), to be adopted by the author; exploratory, no publishable value.
# AMENDMENT 1, 26/10/2026 (before any code or run; executor stop B1, B2, m1-m4 of 26/10/2026): plateau signs alternate and the draw of the durations is fixed (B1); "applied pitch" is defined as the pitch command sent to the S-function (B2); clipping applies to X3 only, X0-X2 keep configuration O8 and their out-of-range instants are counted (m1); time windows of the safety checks fixed, the counts that decide admissibility being taken on 60-180 s where p acts (m2, m5); pitch used in Q_g fixed (m3); order of the 8 runs fixed (m4). Nothing else changes.
# Rule: spec and code committed BEFORE execution; nothing here is changed after results are seen.

campaign:
  id: 'Q1-E4-EXCIT-<date>-a'
  step: 'E4 (exploratory)'
  purpose: 'choose, by a rule fixed before the runs, how the collective pitch is excited around the baseline controller for the E4 dataset, without changing DISCON, its gains or discon_wrapper.m'
  plant: 'configuration O8 of openfast_q1/E3/spec_E3.yaml E3b_region3_qualification.plant_configuration, initial pitch beta_eq_deg of E1 at the mean speed, model built as run_E3b.m; the excitation is injected only in the generated MATLAB Function block'
  status_rule: 'EXPLORATORY: no value of this campaign enters the values registry or the manuscript; it only fixes the excitation of spec_E4'

cases:
  mean_speeds: '16 and 22 m/s (region-3 core of Q1-E3-QUAL-2026-10-22-d)'
  seed: 'RandSeed1 33001 for both speeds (project choice), reserved for this campaign and excluded from E4, E5 and E7'
  wind: 'as spec_E3 E3b_region3_qualification.wind_generation, with UsableTime 180'
  duration: '180 s simulated, statistics on 60-180 s; Q2b on the whole record'
  arms: 'X0, X1, X2, X3 at each speed: 8 runs; X4 (open-loop ServoDyn maneuvers) excluded before the runs: one maneuver per blade and run, data outside the closed loop (author choice delegated to the executor, 23/10/2026)'
  order_amendment_1: 'one run at a time: 16 m/s X0, X1, X2, X3, then 22 m/s X0, X1, X2, X3'

excitation:
  units: 'p is defined in deg; it is converted to rad (p x pi/180) wherever it enters a pitch signal (X2, X3) and for the clipping, since c(1) is in rad (run_E3b.m generated block)'
  signal: 'p(t): sequence of plateaus at +A or -A; each plateau lasts a time drawn uniformly in [0.5, 3] s, counted after the end of the ramp that leads to it; ramps at 4 deg/s (half of PC_MaxRat), so a change from -A to +A lasts 0.5 s for A = 1 deg; drawn with MATLAB rng(33001, twister); p = 0 before t = 60 s, first ramp from 0 to +A at t = 60 s; the same sequence is used for X1-X3, scaled as below'
  signal_amendment_1: 'the plateau signs alternate: +A, -A, +A, ... (the first plateau is +A); only the durations are random: after rng(33001, ''twister''), the vector d = 0.5 + 2.5 x rand(1, 240) is drawn once and d(i) is the duration of plateau i, used in order until t = 180 s; p is evaluated at every DT = 0.00625 s from t = 0'
  A_pitch: '1.0 deg (project choice, no external source)'
  X0: 'no excitation (reference)'
  X1: 'DISCON receives GenSpeed + (A_speed/A_pitch) x p(t), A_speed = 1 % of PC_RefSpd = 1.229096 rad/s (DISCON.F90 l.77); its pitch command and torque are applied unchanged; electrical power recomputed from the true GenSpeed. Expected before the runs: in region 3 the torque VS_RtPwr/GenSpeedF (DISCON.F90 l.385) shifts by about 1 %, i.e. about 0.009 x VS_MaxTq, so X1 is expected to fail torque_consistency; it is run to document this'
  X2: 'DISCON receives BldPitch1 + p(t) x pi/180; its command is applied unchanged'
  X3: 'DISCON receives BldPitch1(k) - p(k-1) x pi/180; the applied pitch command is c(1) + p(k) x pi/180. Limit noted before the runs: on O8, BldPitch1(k) is the S-function input extrapolated with InterpOrder 2 (spec_E3 criteria.reported_only), so the compensation by p(k-1) is not exact'
  bounds: 'applied pitch command clipped to [0, 30 x pi/180] rad (spec_E2 nmpc_interface.constraints); every clipping instant counted'
  bounds_amendment_1: 'the clipping of bounds applies to X3 only, the only arm that adds p to the command; in X0, X1 and X2 the command of DISCON is applied unchanged (configuration O8) and every output step where it lies outside [0, 30] deg is counted as an out-of-range instant'
  logging: 'p(k), the GenSpeed and BldPitch1 values passed to DISCON, the applied command and the wrapper outputs, at every DT'

metrics:
  applied_pitch_amendment_1: 'in every metric below, the applied pitch is the collective pitch command sent to the S-function by the generated block at each output step (after the addition of p and the clipping in X3), in deg, taken from the block log aligned with the .outb as in Q1-E3-QUAL-2026-10-22-d; the same metrics computed with BldPitch1 of the .outb are reported only'
  safety: 'Q2 and Q2b of spec_E3 (Q2b on the whole record), max RotSpeed <= 14.52 rpm (spec_E3 criteria.Q4_overspeed), applied pitch within [0, 30] deg, number of clipping instants'
  safety_windows_amendment_1: 'Q2 and Q2b on the whole record; max RotSpeed, the [0, 30] deg check, the clipping count and the out-of-range count on 60-180 s, where p acts (as spec_E3 duration), and these are the counts used by choice_rule; the clipping and out-of-range counts on the whole record are reported only'
  torque_error: 'RMS over 60-180 s of (GenTq x 1000 - Q_g) / VS_MaxTq (VS_MaxTq = 47402.91 N m, DISCON.F90 l.91), with Q_g = rom_torque_law(omega_f, beta_deg, p) of openfast_q1/E2 evaluated on omega_f rebuilt from the true GenSpeed with the DISCON filter (as spec_E2 validation.V3_pitch_steps.compare) and on the applied pitch; nonzero in X0 because rom_torque_law has no torque-rate limit (DISCON VS_MaxRat, l.405-407)'
  torque_error_amendment_1: 'beta_deg at output step k is the applied pitch at output step k-1, because DISCON tests the region with the command of its previous call (DISCON.F90 l.384, command computed at l.487); at the first output step the applied pitch of that step is used'
  torque_consistency: 'torque_error of the arm minus torque_error of X0 at the same speed'
  independence: '1 - R^2 of the least-squares fit of the applied pitch on [1, RtVAvgxh, GenSpeed] at the same output step over 60-180 s, solved with the MATLAB backslash operator on the regressor matrix; RotSpeed is not used because it is almost proportional to GenSpeed (gearbox ratio 97)'
  excitation_gain: 'independence of the arm minus independence of X0 at the same speed'

choice_rule:
  admissible: 'an arm is admissible if, at both speeds, safety passes, there is no clipping instant, torque_consistency <= 0.002 and excitation_gain >= 0.02 (project choices)'
  admissible_amendment_1: 'no clipping instant applies to X3; for X1 and X2 the condition is no out-of-range instant'
  retained: 'among admissible arms X1-X3, the one with the larger mean excitation_gain over the two speeds; if none is admissible, E4 uses X0 (DISCON only) and this is stated in spec_E4'
  tie: 'between admissible arms only: mean excitation_gain differing by less than 0.02, the arm closer to normal operation is retained, in the order X2, X1, X3'

outputs:
  folder: 'results/Q1-E4-EXCIT-<date>-a/ with meta, case manifests, .inp, .bts, .outb, wrapper and excitation logs, metrics CSV, verdict file stating RETAINED: Xn and the values that decided it'
  register: 'one line EXPLORATORY in openfast_q1/docs/campaign_register_Q1.csv'

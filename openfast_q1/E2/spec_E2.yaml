# E2 campaign spec - reduced-order physics model of the land-based NREL 5-MW
# STATUS: ADOPTED by the author on 15/10/2026, with two corrections (generator_torque, V2_derivatives)
# AMENDMENT 15/10/2026: forbidden_wordings items 1 and 3 enclosed in single quotes to make the file valid YAML; wording unchanged.
# AMENDMENT 2, 15/10/2026 (V0 result): OpenFAST normalizes RtAeroCp and TSR with rmax (deflection-dependent, 62.12-62.98 m in B3) and V_dot_x; Cp table rebuilt from power with fixed R; wind variant selected in V3 by a pre-registered rule.
# AMENDMENT 3, 15/10/2026: J corrected to the ElastoDyn rotor inertia of the model (previous value 43,788,060 came from Jonkman's continuous blade properties, -0.195 % mismatch); V1 uses wind variant (i); V2b transition jumps reported without threshold.
# AMENDMENT 4, 15/10/2026: R corrected from 62.9401 to 63*cos(2.5 deg) = 62.940038 m (rounding error carried from fiche_E1.yaml l.82; generer_drv_E1.m and the AeroMap driver use the exact value); no other change.
# AMENDMENT 5, 16/10/2026: grid-assignment tolerances of the Cp table written in the spec (1e-4). The executor-chosen 1e-6 of build_cp_table_E2.m was below the single-precision resolution of the OpenFAST outputs and stopped attempt Q1-E2-ROM-2026-10-16-a at step C2 (kept as record). The new value was set after that failure, from the grid spacing and the output precision, not from the observed deviations.
# AMENDMENT 6, 22/10/2026: V3 and V4 are run on the plant of the NMPC arms, configuration O8 of spec_E3 (FAST_SFunc, DISCON through the wrapper with the measured BldPitch1, InterpOrder 2, NumCrctn 1), qualified with limits in Q1-E3-QUAL-2026-10-22-d (author decisions D1-D9 of 22/10/2026). V3: steady wind, initial pitch, override maneuver, run length and model drive fixed. V4: data source, time window and input sampling fixed. T_H fixed at 1.5 s before V3. Nothing had been run for V3 or V4.
# Rule: this spec, the model code and the verification/validation scripts are committed
# BEFORE any execution. Thresholds below cannot be changed after results are seen;
# an error is corrected by a dated amendment in a separate commit.

campaign:
  id: Q1-E2-ROM-<execution date>-a
  step: E2
  purpose: >
    Build and qualify the reduced-order physics model used as internal model of the
    physics-based NMPC (arm B), and as the common structure (states, inputs, sample time)
    that the six learned families must reproduce in E5.
  depends_on:
    E1: "Q1-E1-AEROMAP-2026-10-08-a, accepted; B3 table E1_B3.outb sha256 398a8918..."
    E3_DISCON: 'DISCON.dll sha256 b9229079..., region-3 qualification Q1-E3-QUAL-2026-10-22-d QUALIFIED WITH LIMITS (Q3 fails at 14 m/s), spec_E3 sha256 66f7f43ba385d8b2880401d61c6ea1e75601d9c82acbc001159158a96ae96ba4, region-3 core 16-24 m/s, transition 12-14 m/s (amendment 6)'
  adopted_choices: "author's decisions of 15/10/2026 (7 choices) - listed in 'model' and 'nmpc_interface'"

model:
  states:
    omega_r: "low-speed-shaft rotor speed (rad/s); compared with OpenFAST channel RotSpeed"
    omega_f: >
      filtered generator speed (rad/s, high-speed side), first-order low-pass with corner
      frequency 0.25 Hz, as in the baseline controller (Jonkman 2009, sec. 7.1; DISCON.F90 at
      r-test 6fda1b18). Continuous form: d(omega_f)/dt = 2*pi*0.25 * (N*omega_r - omega_f).
  inputs:
    beta: >
      collective pitch angle (deg), manipulated variable. No actuator state: ServoDyn
      (PCMode 4 or 5, BPCutoff 9999.9 Hz) applies the commanded pitch without dynamics.
      Bounds and rate are NMPC constraints (see nmpc_interface), not model states.
  disturbance:
    V: "hub-height longitudinal wind speed (m/s), OpenFAST channel Wind1VelX; variant (i) V_rotor = Wind1VelX, variant (ii) V_rotor = Wind1VelX * cos(5 deg) (ShftTilt -5 deg); variant selected in V3 (amendment 2)"
  equations:
    drivetrain: "J * d(omega_r)/dt = Q_aero - N * Q_g      (single rigid mass)"
    aerodynamics: "Q_aero = 0.5 * rho * A * R * V^2 * Cp(lambda, beta) / lambda,  lambda = omega_r * R / V"
    generator_torque: >
      Jonkman baseline torque law, constants and branch tests read from DISCON.F90 (r-test
      6fda1b18; lines 88-101, 174-180, 384 onward), evaluated on omega_f and on the pitch
      command beta: region 1 if omega_f <= VS_CtInSp (70.16224 rad/s, 670 rpm HSS): Q_g = 0;
      region 1 1/2 below VS_Rgn2Sp (91.21091 rad/s, 871 rpm): linear ramp; region 2 below
      VS_TrGnSp (computed as in DISCON.F90 line 180): Q_g = VS_Rgn2K * omega_f^2 with
      VS_Rgn2K = 2.332287 N m/(rad/s)^2; region 2 1/2: linear, slip VS_SlPc = 10 %;
      region 3 if omega_f >= VS_RtGnSp (121.6805 rad/s, 1161.963 rpm) OR beta >= VS_Rgn3MP
      (1 deg): Q_g = VS_RtPwr / omega_f, VS_RtPwr = 5,296,610 W; saturated at
      VS_MaxTq = 47,402.91 N m. A unit test compares every constant with DISCON.F90.
    electrical_power: "P_e = 0.944 * Q_g * omega_g  (output only; GenEff 94.4 %, GBoxEff 100 %)"
  simplifications_declared:
    - "rigid drivetrain (OpenFAST: DrTrDOF and GenDOF true, first torsion mode 0.6205 Hz)"
    - "no mechanical loss term (GBoxEff = 100 % in ElastoDyn; the only loss is electrical)"
    - "no torque-rate limit (15,000 N m/s in DISCON), adopted 15/10/2026; effect checked in V3 and V4"
    - "quasi-steady aerodynamics (Cp table from steady BEM; OpenFAST runs UA_Mod 3)"
    - "hub-height wind used as rotor-effective wind (variant i) or corrected for shaft tilt only (variant ii); disk averaging and blade elastic velocity not modelled"
  parameters:
    rho:   {value: 1.225, unit: kg/m3, source: "5MW_Land .fst AirDens (model commit 7232a48)"}
    R:     {value: 62.940038, unit: m, source: "R = TipRad*cos(PreCone) = 63*cos(2.5 deg), computed in code; equals rTipFixMax, the radius used by the AeroMap driver to set WindSpeed from TSR in B3 (FAST_SS_Subs.f90:216; AeroDyn.f90:4664-4675); fixed reference radius for Cp and lambda (amendments 2 and 4)"}
    A:     {value: "pi*R^2", source: "fixed reference area pi*R^2; OpenFAST uses pi*rmax^2 with deflection-dependent rmax (AeroDyn_IO.f90:313), hence the rebuilt table (amendment 2)"}
    J:     {value: 43702557, unit: kg m2, source: "rotor inertia 38,677,060 kg m2 computed by ElastoDyn v4.2.1 for this model (BldNodes 17, AdjBlMs 1.04536, PreCone -2.5 deg, HubIner 115,926), read in results/Q1-E3-DISCON-BUILD-2026-10-09-a/test/5MW_Land_DLL_WTurb/5MW_Land_DLL_WTurb.ED.sum (sha256 9a886ece45329588ba7a25dc9d0934e3c65b51123d12853796f33f65ab6459dc) + 97^2 * GenIner 534.116; compute_inertia_E2.m reproduces the ElastoDyn method and stops if the deviation exceeds 0.1 % (amendment 3)"}
    N:     {value: 97, source: "ElastoDyn GBRatio"}
    Cp:    {source: "E1_B3.outb (12.1 rpm, lambda 2:0.25:13, beta 0:0.5:30); Cp = RtAeroPwr / (0.5*rho*pi*R^2*WindSpeed^3), lambda = (RotorSpeed*pi/30)*R/WindSpeed (RotorSpeed in rpm), R = 63*cos(2.5 deg) m fixed (amendment 4); RtAeroCp and TSR columns not used (amendment 2)"}
  cp_interpolant:
    method: "griddedInterpolant 'makima' (C1, no overshoot)  # adopted 15/10/2026"
    out_of_domain: "no extrapolation, no clipping of Cp at 0 or at Betz; a domain flag is raised and counted"
    numerical_guard: "lambda computed with V >= 0.1 m/s; named 'numerical guard', reported if active"
    grid_assignment: "each B3 case is assigned to its (lambda, beta) node if |lambda/node - 1| <= 1e-4 and |beta - node| <= 1e-4 deg (amendment 5); node spacing 0.25 in lambda (relative half-spacing >= 9.6e-3) and 0.5 deg in beta; OpenFAST outputs are single precision (1 ulp = 1.9e-6 deg between 16 and 32 deg)"
  discretization:
    form: "discrete-time model supplied to nlmpc (IsContinuousTime = false)"
    integrator: "RK4, 4 sub-steps per Ts  # adopted 15/10/2026"
    precision: "double throughout"

nmpc_interface:   # what E6 will use; fixed here so that B and C1..C6 share it
  Ts: {main: 0.05, sensitivity: [0.025, 0.1], unit: s, note: "integer multiples of OpenFAST DT = 0.00625 s"}
  horizon: 'T_H = 1.5 s (Np = 30 at Ts = 0.05 s), fixed by amendment 6 before V3; no value measured in V3 changes T_H'
  cost: "speed tracking (omega_r - omega_rated)^2 + pitch increments; NO electrical-power term"
  power_reference: "P_ref = 5 MW electrical, used as an outcome metric only"
  constraints: "beta in [0, 30] deg, |d beta/dt| <= 8 deg/s (Jonkman), as MV bounds and MV rate bounds"  # B3 table domain; fraction of time DISCON exceeds 30 deg measured in E3
  wind_assumption: "main arms: V measured at hub at time k, held constant over the horizon; separate arm with perfect preview (E7)"
  coupling: "Simulink S-function FAST_SFunc (PCMode = 4, VSContrl = 4) for NMPC arms"

verification:   # no OpenFAST run needed
  V0_conventions:
    check: "R and A used by OpenFAST for RtAeroCp and TSR (AeroDyn source v4.2.1, file and line quoted)"
    pass: "identical to the parameters above; otherwise stop and amend before coding"
    result: "15/10/2026: not identical - rmax varies with blade deflection (B3: 62.12-62.98 m; Cp error -2.04 % to +0.12 % on lambda >= 3); V_dot_x = WindSpeed in AeroMap. Amendment 2 applied before any code."
  V1_equilibrium:
    check: >
      at the 15 E1 wind speeds, omega_r = 12.1 rpm, beta = E1 beta_eq (C3_C4_par_vent.csv):
      residual torque |Q_aero - N*Q_g| / Q_rated_LSS
    pass: "<= 1 % at each of the 14 non-saturated speeds  # adopted 15/10/2026"
    variant: "(i) - E1 equilibria come from AeroMap, where V_dot_x = WindSpeed (V0 result) (amendment 3)"
  V2_derivatives:
    check: >
      Jacobian of the discrete model w.r.t. x and beta on the 15 equilibria: forward finite
      differences as used by nlmpc vs central differences; relative step swept from 1e-2 to
      1e-10; reference = plateau of the central differences. Complex step not applicable
      (griddedInterpolant, min/max do not propagate the imaginary part).
    pass: >
      relative error <= 1e-5 at the nlmpc default step where interpolant and torque law are
      smooth; points at region transitions and saturations reported separately
  V2b_units_signs: "unit tests: signs of dQ_aero/dbeta (< 0 above rated) and dQ_aero/dV (> 0) - SATISFIED / NOT SATISFIED; torque-law jumps at region transitions, including the switch to region 3 at beta >= 1 deg - REPORTED, no threshold (amendment 3)"

validation:     # against OpenFAST + qualified DISCON
  V3_pitch_steps:
    plant: 'configuration O8 of spec_E3 (amendment 4): FAST_SFunc with PCMode 4 and VSContrl 4, DISCON b9229079 called at every DT by the wrapper of spec_E3 campaign.depends_on.wrapper with the measured BldPitch1, InterpOrder 2, NumCrctn 1 in the .fst copy; 6 runs: steady wind 14, 18 and 22 m/s, override to beta_eq + 1 deg and to beta_eq - 1 deg (amendment 6)'
    steady_wind: 'copy of the InflowWind file of the case (NRELOffshrBsline5MW_InflowWind_12mps.dat): WindType 3 -> 1 and HWindSpeed 0 -> U (14, 18 or 22), old values checked; RefHt 90 m and PLExp 0.2 of that file unchanged (amendment 6)'
    initial_conditions: 'ElastoDyn copy: BlPitch(1), BlPitch(2), BlPitch(3) 0 -> beta_eq_deg of results/Q1-E1-AEROMAP-2026-10-08-a/analyse/C3_C4_par_vent.csv (SHA-256 46bcc04149a2fbfbbc95cd3c11b5a7a3acc4b96b0cd21011be5ceeb871be671e) at U, written with four decimals (14 m/s 8.5723, 18 m/s 14.9124, 22 m/s 19.8512 deg), old value checked, as spec_E3 E3b_region3_qualification.runs; RotSpeed 12.1 rpm of the model unchanged (amendment 6)'
    maneuver: 'ServoDyn copy: TPitManS(1-3) 9999.9 -> 60 s, PitManRat(1-3) 2 -> 8 deg/s, BlPitchF(1-3) 0 -> beta_eq_deg(U) + 1 or - 1 deg written with four decimals (14 m/s 9.5723 or 7.5723, 18 m/s 15.9124 or 13.9124, 22 m/s 20.8512 or 18.8512 deg), old values checked; the override applies whatever PCMode (ServoDyn.f90 l.5402-5420, OpenFAST v4.2.1); TMax = 70 s (amendment 6)'
    compare: 'RotSpeed (omega_r) from 60 to 70 s; the model is initialised at t = 60 s with omega_r = RotSpeed(60 s) and omega_f rebuilt at every output step from t = 0 from GenSpeed (rad/s) with the DISCON filter (GenSpeedF = (1 - Alpha) x GenSpeed + Alpha x GenSpeedF, Alpha = exp(-DT x 1.570796), initial GenSpeedF = first GenSpeed; DISCON.F90 l.58, l.303, l.355, l.360); it is driven by BldPitch1 and Wind1VelX of the run, each held over one Ts = 0.05 s at its value at the start of the step, and compared at the instants 60 + k x Ts (amendment 6)'
    pass: "e_max(omega_r) over the first 1.5 s <= 2 % of rated rotor speed  # adopted 15/10/2026; 10-s window reported only"
    outputs_added: "AeroDyn OutList of the V3 runs only: RtVAvgxh, RtAeroPwr, RtAeroCp, RtArea, RtTSR (output channels only, no physics change); ratio RtVAvgxh / Wind1VelX reported"
    variant_rule: "wind variants (i) and (ii) both evaluated; the variant with the lower sum over the 6 steps of e_max(omega_r) in the first 1.5 s is retained for V4 and E6; V4 is evaluated with the retained variant only"
    reported_only: 'per run: realised step BlPitchF - BldPitch1(60 s), max |BldPitch1(t) - BldPitch1(60 s)| over 50-60 s, RotSpeed change at 61.5 s and at 70 s relative to RotSpeed(60 s) (amendment 6)'
  V4_turbulent_segments:
    data: 'the 21 runs of Q1-E3-QUAL-2026-10-22-d (repetition excluded, seeds 31001-31003 reserved for E3 and E2 V4 by spec_E3 seeds), configuration O8 with initial pitch beta_eq, only t >= 60 s (spec_E3 duration), all 7 mean speeds evaluated and reported per speed (amendment 6)'
    protocol: 'consecutive non-overlapping segments of length T_H = 1.5 s from t = 60 s; at the start of each segment the model is re-initialised on the OpenFAST state (omega_r = RotSpeed, omega_f rebuilt as in V3 compare); inputs: BldPitch1 held over each Ts = 0.05 s at its value at the start of the step; wind either (a) Wind1VelX held over each Ts in the same way, or (b) Wind1VelX at the start of the segment held over the whole segment; comparison at the instants k x Ts of the segment; (a) measures the model error, (b) adds the wind-assumption error (amendment 6)'
    metrics: "RMSE, MAE, e_max, bias of omega_r, per wind speed; median and P95 over segments"
    pass: "(a) median e_max <= 2 % and P95 e_max <= 5 % of rated rotor speed  # adopted 15/10/2026; (b) reported only"
  exit_decision: "GO if V0-V4 pass; GO WITH CONDITIONS if V4 fails only at listed speeds (domain restricted, stated in paper); NO-GO otherwise"

order_of_work:
  1: "adopt this spec; commit spec + model code + verification scripts (before execution)"
  2: "run V0-V2 (no OpenFAST)"
  3: "exploratory Simulink feasibility test (separate short spec; no publishable value)"
  4: "E3: plant-equivalence test (exe+DISCON vs S-function replay) and region-3 qualification of DISCON"
  5: "run V3-V4; exit decision"

forbidden_wordings:
  - '"validated" for the model before V3 and V4 pass'
  - "real time"
  - '"the pitch regulates power" (region 3: power is held by the torque law)'

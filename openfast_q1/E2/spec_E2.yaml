# E2 campaign spec - reduced-order physics model of the land-based NREL 5-MW
# STATUS: ADOPTED by the author on 15/10/2026, with two corrections (generator_torque, V2_derivatives)
# AMENDMENT 15/10/2026: forbidden_wordings items 1 and 3 enclosed in single quotes to make the file valid YAML; wording unchanged.
# AMENDMENT 2, 15/10/2026 (V0 result): OpenFAST normalizes RtAeroCp and TSR with rmax (deflection-dependent, 62.12-62.98 m in B3) and V_dot_x; Cp table rebuilt from power with fixed R; wind variant selected in V3 by a pre-registered rule.
# AMENDMENT 3, 15/10/2026: J corrected to the ElastoDyn rotor inertia of the model (previous value 43,788,060 came from Jonkman's continuous blade properties, -0.195 % mismatch); V1 uses wind variant (i); V2b transition jumps reported without threshold.
# AMENDMENT 4, 15/10/2026: R corrected from 62.9401 to 63*cos(2.5 deg) = 62.940038 m (rounding error carried from fiche_E1.yaml l.82; generer_drv_E1.m and the AeroMap driver use the exact value); no other change.
# AMENDMENT 5, 16/10/2026: grid-assignment tolerances of the Cp table written in the spec (1e-4). The executor-chosen 1e-6 of build_cp_table_E2.m was below the single-precision resolution of the OpenFAST outputs and stopped attempt Q1-E2-ROM-2026-10-16-a at step C2 (kept as record). The new value was set after that failure, from the grid spacing and the output precision, not from the observed deviations.
# AMENDMENT 6, 22/10/2026: V3 and V4 are run on the plant of the NMPC arms, configuration O8 of spec_E3 (FAST_SFunc, DISCON through the wrapper with the measured BldPitch1, InterpOrder 2, NumCrctn 1), qualified with limits in Q1-E3-QUAL-2026-10-22-d (author decisions D1-D9 of 22/10/2026). V3: steady wind, initial pitch, override maneuver, run length and model drive fixed. V4: data source, time window and input sampling fixed. T_H fixed at 1.5 s before V3. Nothing had been run for V3 or V4.
# AMENDMENT 7, 22/10/2026: model v2. The disturbance input V becomes the rotor-effective wind RtVAvgxh of AeroDyn, assumed perfectly known by every NMPC arm (idealisation, author decision A of 22/10/2026), after the NO-GO of model v1 (Q1-E2-V4-2026-10-22-a) and the exploratory diagnostic Q1-E2-DIAGV4-2026-10-22-a. Equations, parameters, Cp table and code are unchanged; only the signal used as V changes. Because this input was chosen after seeing DIAGV4 on the E3b-d segments, V4-b uses new turbulent runs with new seeds; V3-b replays the V3 runs offline (no model v2 result had been computed on them). Thresholds unchanged. Model v1 results stay on record.
# AMENDMENT 8, 03/11/2026 (adopted 03/11/2026 by the supervisor under the author delegation of 31/10/2026, the margin of decision A2 accepted by the author on 03/11/2026; built by the supervisor from executor draft 2, sha256 2e03523521732568f0ba8c960b08643803ed53ec8e1e7b44101016e565fc7f62, outside Git, with decisions A1 to A6 of the supervisor review of draft 1 and the A5 rule for non-numeric classes added): two modes for the Cp table domain and NMPC pitch bounds with a margin. Origin: decision E6-8 of 31/10/2026 (lambda bounded to [2, 13] before the interpolant, with a counter) and openfast_q1/E6/spec_E6_solver_O8.yaml prediction.cp_fallback (commit 1aa85e1); the bound of beta to [0, 30] deg is added by the supervisor on 03/11/2026 (basis in model.cp_interpolant.out_of_domain); the NMPC MV bounds [0.01, 29.99] deg are decision A2 of the supervisor of 03/11/2026 (basis in nmpc_interface.constraints). Authority: author delegation of 31/10/2026, revisable by the author; the margin of decision A2 accepted by the author on 03/11/2026. Keys changed: model.cp_interpolant.out_of_domain (validation mode = the previous text unchanged, for V0 to V4 and every result already produced; NMPC mode added) and nmpc_interface.constraints (plant_and_validation = the previous text unchanged; NMPC arms added). No result of V0 to V4 is changed; nothing has been run in the NMPC mode.
# Rule: this spec, the model code and the verification/validation scripts are committed
# BEFORE any execution. Thresholds below cannot be changed after results are seen;
# an error is corrected by a dated amendment in a separate commit.

campaign:
  id: Q1-E2-ROM-<execution date>-a
  step: E2
  purpose: >
    Build and qualify the reduced-order physics model used as internal model of the
    physics-based NMPC (arm B), and as the common structure (states, inputs, sample time)
    that the six learned families must reproduce in E5.
  depends_on:
    E1: "Q1-E1-AEROMAP-2026-10-08-a, accepted; B3 table E1_B3.outb sha256 398a8918..."
    E3_DISCON: 'DISCON.dll sha256 b9229079..., region-3 qualification Q1-E3-QUAL-2026-10-22-d QUALIFIED WITH LIMITS (Q3 fails at 14 m/s), spec_E3 sha256 66f7f43ba385d8b2880401d61c6ea1e75601d9c82acbc001159158a96ae96ba4, region-3 core 16-24 m/s, transition 12-14 m/s (amendment 6)'
  adopted_choices: "author's decisions of 15/10/2026 (7 choices) - listed in 'model' and 'nmpc_interface'"

model:
  states:
    omega_r: "low-speed-shaft rotor speed (rad/s); compared with OpenFAST channel RotSpeed"
    omega_f: >
      filtered generator speed (rad/s, high-speed side), first-order low-pass with corner
      frequency 0.25 Hz, as in the baseline controller (Jonkman 2009, sec. 7.1; DISCON.F90 at
      r-test 6fda1b18). Continuous form: d(omega_f)/dt = 2*pi*0.25 * (N*omega_r - omega_f).
  inputs:
    beta: >
      collective pitch angle (deg), manipulated variable. No actuator state: ServoDyn
      (PCMode 4 or 5, BPCutoff 9999.9 Hz) applies the commanded pitch without dynamics.
      Bounds and rate are NMPC constraints (see nmpc_interface), not model states.
  disturbance:
    V: 'rotor-effective wind speed (m/s), model v2 (amendment 7): OpenFAST channel RtVAvgxh of AeroDyn v4.2.1, equal-weight average over all blade nodes of the disturbed inflow minus the average blade elastic velocity, in hub axes (AeroDyn.f90 l.3380-3404, AeroDyn_IO.f90 l.313-316), used directly as V_rotor (variant (i) only). Model v1 (record of Q1-E2-V3-2026-10-22-a and Q1-E2-V4-2026-10-22-a): V = Wind1VelX, variant (i) or variant (ii) = Wind1VelX x cos(5 deg)'
  equations:
    drivetrain: "J * d(omega_r)/dt = Q_aero - N * Q_g      (single rigid mass)"
    aerodynamics: "Q_aero = 0.5 * rho * A * R * V^2 * Cp(lambda, beta) / lambda,  lambda = omega_r * R / V"
    generator_torque: >
      Jonkman baseline torque law, constants and branch tests read from DISCON.F90 (r-test
      6fda1b18; lines 88-101, 174-180, 384 onward), evaluated on omega_f and on the pitch
      command beta: region 1 if omega_f <= VS_CtInSp (70.16224 rad/s, 670 rpm HSS): Q_g = 0;
      region 1 1/2 below VS_Rgn2Sp (91.21091 rad/s, 871 rpm): linear ramp; region 2 below
      VS_TrGnSp (computed as in DISCON.F90 line 180): Q_g = VS_Rgn2K * omega_f^2 with
      VS_Rgn2K = 2.332287 N m/(rad/s)^2; region 2 1/2: linear, slip VS_SlPc = 10 %;
      region 3 if omega_f >= VS_RtGnSp (121.6805 rad/s, 1161.963 rpm) OR beta >= VS_Rgn3MP
      (1 deg): Q_g = VS_RtPwr / omega_f, VS_RtPwr = 5,296,610 W; saturated at
      VS_MaxTq = 47,402.91 N m. A unit test compares every constant with DISCON.F90.
    electrical_power: "P_e = 0.944 * Q_g * omega_g  (output only; GenEff 94.4 %, GBoxEff 100 %)"
  simplifications_declared:
    - "rigid drivetrain (OpenFAST: DrTrDOF and GenDOF true, first torsion mode 0.6205 Hz)"
    - "no mechanical loss term (GBoxEff = 100 % in ElastoDyn; the only loss is electrical)"
    - "no torque-rate limit (15,000 N m/s in DISCON), adopted 15/10/2026; effect checked in V3 and V4"
    - "quasi-steady aerodynamics (Cp table from steady BEM; OpenFAST runs UA_Mod 3)"
    - 'model v2 (amendment 7): rotor-effective wind taken as RtVAvgxh computed by AeroDyn from the full wind field; it is not measurable on a real turbine and is assumed perfectly known (idealisation); model v1 used the hub-height wind Wind1VelX (disk averaging not modelled)'
  parameters:
    rho:   {value: 1.225, unit: kg/m3, source: "5MW_Land .fst AirDens (model commit 7232a48)"}
    R:     {value: 62.940038, unit: m, source: "R = TipRad*cos(PreCone) = 63*cos(2.5 deg), computed in code; equals rTipFixMax, the radius used by the AeroMap driver to set WindSpeed from TSR in B3 (FAST_SS_Subs.f90:216; AeroDyn.f90:4664-4675); fixed reference radius for Cp and lambda (amendments 2 and 4)"}
    A:     {value: "pi*R^2", source: "fixed reference area pi*R^2; OpenFAST uses pi*rmax^2 with deflection-dependent rmax (AeroDyn_IO.f90:313), hence the rebuilt table (amendment 2)"}
    J:     {value: 43702557, unit: kg m2, source: "rotor inertia 38,677,060 kg m2 computed by ElastoDyn v4.2.1 for this model (BldNodes 17, AdjBlMs 1.04536, PreCone -2.5 deg, HubIner 115,926), read in results/Q1-E3-DISCON-BUILD-2026-10-09-a/test/5MW_Land_DLL_WTurb/5MW_Land_DLL_WTurb.ED.sum (sha256 9a886ece45329588ba7a25dc9d0934e3c65b51123d12853796f33f65ab6459dc) + 97^2 * GenIner 534.116; compute_inertia_E2.m reproduces the ElastoDyn method and stops if the deviation exceeds 0.1 % (amendment 3)"}
    N:     {value: 97, source: "ElastoDyn GBRatio"}
    Cp:    {source: "E1_B3.outb (12.1 rpm, lambda 2:0.25:13, beta 0:0.5:30); Cp = RtAeroPwr / (0.5*rho*pi*R^2*WindSpeed^3), lambda = (RotorSpeed*pi/30)*R/WindSpeed (RotorSpeed in rpm), R = 63*cos(2.5 deg) m fixed (amendment 4); RtAeroCp and TSR columns not used (amendment 2)"}
  cp_interpolant:
    method: "griddedInterpolant 'makima' (C1, no overshoot)  # adopted 15/10/2026"
    out_of_domain:
      validation: "no extrapolation, no clipping of Cp at 0 or at Betz; a domain flag is raised and counted"
      validation_scope: 'V0 to V4 and every result already produced; default mode of the code (amendment 8)'
      nmpc: 'before the interpolant, lambda is bounded to [2, 13] and beta to [0, 30] deg, the grid of the table (model.parameters.Cp: lambda 2:0.25:13, beta 0:0.5:30); Cp is the value of the interpolant at the bounded point; the domain flag is raised at every bounded evaluation and the count is kept separately for lambda and for beta; with the NMPC MV bounds of nmpc_interface.constraints.nmpc_arms the bound on beta acts as a guard only, with its count (decision A2) (amendment 8)'
      nmpc_scope: 'the evaluation of C5 in E5 (spec_E6 decision E6_4: one prediction function for the E5 evaluation and for the NMPC), the arms B and C5 of E6, and E7 (openfast_q1/E6/spec_E6_solver_O8.yaml prediction.cp_fallback, commit 1aa85e1) (amendment 8)'
      nmpc_torque: 'decision A1 of the supervisor of 03/11/2026 (executor proposal of draft 1 adopted): the aerodynamic torque keeps the formula of model.equations.aerodynamics with the actual lambda = omega_r R / V in the division, i.e. Q_aero = 0.5 rho A V^3 Cp(lambda_b, beta_b) / omega_r with lambda_b and beta_b the bounded arguments; only the two arguments of the interpolant are bounded; omega_r > 0 is assumed; lambda = 0 (omega_r = 0) would give a non-finite torque, handled by openfast_q1/E6/spec_E6_solver_O8.yaml solver_failure.non_finite (amendment 8)'
      nmpc_basis_lambda: 'decision E6-8 of 31/10/2026: in the validation mode a NaN Cp makes the NMPC call fail; even with a constraint on lambda, the iterates and the finite-difference perturbations of the solver evaluate the model outside the domain (supervisor review of 31/10/2026); the state perturbation of the forward differences, dv x max(|omega_r|, 1) with dv = 1e-6 (MATLAB R2024a computeJacobianState.m l.19-30, sha256 f60c0b6b73bf1d4a00e6303025a1bb15b6a18fecb9174073feb311dd0a89d816), moves lambda across 2 or 13 when lambda is at that value (reasoning on the code) (amendment 8)'
      nmpc_basis_beta: 'facts read in the code: the interpolant is built with ExtrapolationMethod none (openfast_q1/E2/rom_params.m l.75, sha256 0b886331556bbb069238ec80709ac0d476824f81666813f6890e2444442f59b8), so a query outside the grid returns NaN (rom_rhs.m l.18-19 comment; behaviour of the built-in griddedInterpolant, not readable); rom_rhs.m l.43-44 (sha256 0ef3c080fbf07df660fb6f1d3000be2cdc496a7ede4cd6d9e4059e90aee2a37d) evaluate Cp = p.Cp(lambda, beta_deg) and set domain = isnan(Cp); the MV bound of the NMPC is 30 deg, the top of the beta grid (nmpc_interface.constraints); the forward differences retained for B and C5 (spec_E6_solver_O8 gradient.jacobians_per_arm.B_and_C5, the rule of nlmpc) perturb the MV upward only, by dv x max(|u|, 1) (computeJacobianState.m l.33-38: du = dv*ua(k), u0(k) = u0(k) + du), i.e. by 3e-5 deg at beta = 30 deg, so the Jacobian evaluates beta = 30.00003 deg, outside the grid, and by 1e-6 deg at beta = 0, inside; at an iterate beta = -1e-6 deg, within ConstraintTolerance below the bound 0, the point is bounded to 0 and the perturbed point is -1e-6 + 1e-6 = 0 deg, so both evaluations are at beta = 0 and the numerical derivative is zero (supervisor review of draft 1, 03/11/2026); in O8 and in nlmpc the MV bounds are linear inequality rows and not bounds (getUBounds.m l.15-51; getZBounds.m l.15-17: MV decisions unbounded), so an iterate or an accepted solution can exceed 30 deg or go below 0 deg by up to ConstraintTolerance (1e-6 by default, fmincon.m l.166; nlmpcmove.m l.177 compares the constraint violation with ConstraintTolerance) (reasoning on the code; the sqp internals are protected, sqpInterface.p) (amendment 8)'
      nmpc_consequences: '(1) beyond a bound the derivative of Cp with respect to the bounded argument is zero and the bound is a kink; with MV bounds [0, 30] deg, the upward forward difference of the beta column at beta = 30 deg, and the two evaluations at an iterate beta = -1e-6 deg, would give dCp/dbeta = 0 although the derivative inside the grid is not zero (nmpc_basis_beta); with the NMPC MV bounds [0.01, 29.99] deg of nmpc_interface.constraints.nmpc_arms (decision A2), the MV, its iterates within ConstraintTolerance and its forward-difference steps stay inside the beta grid (reasoning on the code, nmpc_interface.constraints.nmpc_basis), so the bound on beta acts as a guard only and is counted; a zero derivative remains possible for the state column at the lambda bounds 2 and 13 (nmpc_basis_lambda); these points are reported separately by spec_E6_solver_O8 gradient_check (decision A3); (2) spec_E5 E4_findings.F3_cp_domain.treatment and framework_decisions.selection rely on the domain count (a segment with n_domain > 0 is a failure of C5; a sample whose rom_step evaluation leaves the domain is excluded from the training of C5): their meaning is unchanged since the count is kept; the bounding rule is the identity inside the domain (point 3) and a sample whose evaluation leaves the domain is excluded in both modes because the exclusion rests on the count, so the mode used for the training target of C5 and for its evaluation in E5 has no effect on the retained samples; the phrase has no defined residual of F3_cp_domain.treatment describes the validation mode; spec_E5 is not amended (decision A4); (3) inside the domain min(max(v, lo), hi) = v, so both modes give the same values wherever the count is zero (reasoning); no result of V0 to V4 is changed (amendment 8)'
      nmpc_code: 'described only, code and test under a separate authorisation: a mode option in rom_rhs and rom_step, validation by default, the validation path left unchanged; in the NMPC mode rom_rhs bounds lambda and beta with p.lambda_dom and p.beta_dom (rom_params.m l.69-70) before p.Cp, and returns info.domain_lambda and info.domain_beta besides info.domain (true when either is bounded); rom_step sums them as n_domain_lambda and n_domain_beta besides n_domain; non-regression test fixed in advance: the validation mode reproduces the reference outputs of Q1-E2-V3-2026-10-22-b and Q1-E2-V4-2026-10-23-b byte for byte on their CSV files (V3b_runs.csv sha256 dc2491ae80512902dee624beda02cb993bcbb787558309dd8af6216d86988bd9, V4b_per_speed.csv sha256 d9347ff0a530b18f0a713ca2487299702517ceb61432b5455812d7e8b2e5cdab) and on the arrays of their MAT files (V3b_trajectories.mat sha256 0d0813df63953f83635cce174a3e569bbff5cf49ef9d4d8a7f635c662b459d92, V4b_segments.mat sha256 71320bea329dd4d9f927dac425a775a0d152f2dd3aad9fba57f684b5e9764733), whose 116-byte header holds a creation date (read: Created on Thu Oct 22 20:13:01 2026 and Fri Oct 23 11:04:49 2026), so a MAT file itself cannot be equal byte for byte; the arrays are compared field by field, descending into structures, cells and tables, by class, size and bytes (typecast(x(:), ''uint8'')), not by isequal, which treats two NaN as different and does not compare bytes (decision A5); typecast takes numeric arrays only, so a char array is compared through uint16(x(:)), a logical array through uint8(x(:)) and a string array element by element through char, each with its class and size; any other class stops the test and is reported (supervisor, 03/11/2026, point 4 of draft 2) (amendment 8)'
      nmpc_facts_E4: 'facts read on 03/11/2026 (decision A6), read only, on the X0 runs of the training seeds 34001 to 34003 of Q1-E4-DATA-2026-10-28-a (dataset tables results/Q1-E4-DATA-2026-10-28-a/dataset/U<speed>_S<seed>_X0_Ts0p050.mat: t >= 60 s, Ts = 0.05 s, u and d held over each step, 12000 samples per run, 36000 per speed; seeds 34004 and 34005 not read; script a6_E2_am8.m sha256 8638c31d243b2ef7939487cc0c5e950a62e73f2e73e361a418ba7a0d78229c15, output A6_E2_am8.csv sha256 587ac5a01d3a60e45e6a25b42b329b0606f3288b4cd9d490010111156d8c04e5, both in the temporary folder of the author computer, not committed): fraction of samples with applied pitch u <= 0.01 deg: 12 m/s 0.444917, 14 m/s 0.099528, 16 m/s 0.012528, 18 m/s 0.000889, 20, 22 and 24 m/s 0; with u >= 29.99 deg: 0 at every speed (largest u 28.082229 deg, at 24 m/s); with lambda = omega_r R / RtVAvgxh (R = 63 cos(2.5 deg), rom_params.m l.22) outside [2, 13]: 0 at every speed (lambda from 2.645216 to 9.127242); these samples are those of the baseline controller DISCON (arm X0), not of an NMPC (amendment 8)'
    numerical_guard: "lambda computed with V >= 0.1 m/s; named 'numerical guard', reported if active"
    grid_assignment: "each B3 case is assigned to its (lambda, beta) node if |lambda/node - 1| <= 1e-4 and |beta - node| <= 1e-4 deg (amendment 5); node spacing 0.25 in lambda (relative half-spacing >= 9.6e-3) and 0.5 deg in beta; OpenFAST outputs are single precision (1 ulp = 1.9e-6 deg between 16 and 32 deg)"
  discretization:
    form: "discrete-time model supplied to nlmpc (IsContinuousTime = false)"
    integrator: "RK4, 4 sub-steps per Ts  # adopted 15/10/2026"
    precision: "double throughout"

nmpc_interface:   # what E6 will use; fixed here so that B and C1..C6 share it
  Ts: {main: 0.05, sensitivity: [0.025, 0.1], unit: s, note: "integer multiples of OpenFAST DT = 0.00625 s"}
  horizon: 'T_H = 1.5 s (Np = 30 at Ts = 0.05 s), fixed by amendment 6 before V3; no value measured in V3 changes T_H'
  cost: "speed tracking (omega_r - omega_rated)^2 + pitch increments; NO electrical-power term"
  power_reference: "P_ref = 5 MW electrical, used as an outcome metric only"
  constraints:
    plant_and_validation: "beta in [0, 30] deg, |d beta/dt| <= 8 deg/s (Jonkman), as MV bounds and MV rate bounds"  # B3 table domain; fraction of time DISCON exceeds 30 deg measured in E3
    plant_and_validation_scope: 'the text before amendment 8, unchanged; it holds for the plant and for the validation V0 to V4 and every result already produced (amendment 8)'
    nmpc_arms: 'for the NMPC arms (B and C1 to C6, nlmpc and O8 alike): beta in [0.01, 29.99] deg as MV bounds; |d beta/dt| <= 8 deg/s unchanged as MV rate bounds (decision A2 of the supervisor of 03/11/2026) (amendment 8)'
    nmpc_basis: 'reasoning on the code: the margin 0.01 deg is larger than ConstraintTolerance (1e-6, fmincon.m l.166; spec_E6_solver_O8 solver.tolerances_and_limits) plus the upward forward-difference step of the MV (dv x max(|u|, 1) with dv = 1e-6, computeJacobianState.m l.33-38: at most 3e-5 deg, at 30 deg), so the MV of an accepted solution and its forward-difference steps stay inside the beta grid 0:0.5:30 of model.parameters.Cp (lowest evaluation 0.01 - 1e-6 = 0.009999 deg, highest 29.99 + 1e-6 + 3e-5 = 29.990031 deg); the violation of the linear MV rows is bounded by ConstraintTolerance at an accepted solution (nlmpcmove.m l.177-178); the behaviour of sqp at intermediate iterates is not readable (sqpInterface.p protected), and any evaluation outside the grid goes through the guard of model.cp_interpolant.out_of_domain.nmpc and is counted; nlmpc and O8 use the same bounds, so the equivalence test of spec_E6_solver_O8 stays symmetric, without a one-sided Jacobian rule (amendment 8)'
    nmpc_nature: 'a project choice, declared: the NMPC commands no pitch below 0.01 deg or above 29.99 deg; facts in model.cp_interpolant.out_of_domain.nmpc_facts_E4; the margin was accepted by the author on 03/11/2026, the alternative, a one-sided Jacobian rule specific to O8 (supervisor review of draft 1, 03/11/2026), not being retained (amendment 8)'
    nmpc_consequence: 'openfast_q1/E6/spec_E6_solver_O8.yaml constraints.values (Min = 0 deg, Max = 30 deg) is to be amended in a separate commit, not authorised by amendment 8, together with its citation spec_E2 nmpc_interface.constraints l.82, which moves to l.93-99 with amendment 8; the code that sets the MV bounds from p.beta_min and p.beta_max (openfast_q1/E2/rom_params.m l.60-61; openfast_q1/F_simulink/make_nlobj.m l.9-10; openfast_q1/F_simulink/run_F.m l.232-233) is not changed by amendment 8 (amendment 8)'
  wind_assumption: 'main arms: rotor-effective wind RtVAvgxh at time k, assumed perfectly known (idealisation, amendment 7), held constant over the horizon; the same disturbance input is used by every arm (B and C1..C6) and recorded in the E4 data together with Wind1VelX; separate arm with perfect preview of RtVAvgxh (E7)'
  coupling: "Simulink S-function FAST_SFunc (PCMode = 4, VSContrl = 4) for NMPC arms"

verification:   # no OpenFAST run needed
  V0_conventions:
    check: "R and A used by OpenFAST for RtAeroCp and TSR (AeroDyn source v4.2.1, file and line quoted)"
    pass: "identical to the parameters above; otherwise stop and amend before coding"
    result: "15/10/2026: not identical - rmax varies with blade deflection (B3: 62.12-62.98 m; Cp error -2.04 % to +0.12 % on lambda >= 3); V_dot_x = WindSpeed in AeroMap. Amendment 2 applied before any code."
  V1_equilibrium:
    check: >
      at the 15 E1 wind speeds, omega_r = 12.1 rpm, beta = E1 beta_eq (C3_C4_par_vent.csv):
      residual torque |Q_aero - N*Q_g| / Q_rated_LSS
    pass: "<= 1 % at each of the 14 non-saturated speeds  # adopted 15/10/2026"
    variant: "(i) - E1 equilibria come from AeroMap, where V_dot_x = WindSpeed (V0 result) (amendment 3)"
  V2_derivatives:
    check: >
      Jacobian of the discrete model w.r.t. x and beta on the 15 equilibria: forward finite
      differences as used by nlmpc vs central differences; relative step swept from 1e-2 to
      1e-10; reference = plateau of the central differences. Complex step not applicable
      (griddedInterpolant, min/max do not propagate the imaginary part).
    pass: >
      relative error <= 1e-5 at the nlmpc default step where interpolant and torque law are
      smooth; points at region transitions and saturations reported separately
  V2b_units_signs: "unit tests: signs of dQ_aero/dbeta (< 0 above rated) and dQ_aero/dV (> 0) - SATISFIED / NOT SATISFIED; torque-law jumps at region transitions, including the switch to region 3 at beta >= 1 deg - REPORTED, no threshold (amendment 3)"

validation:     # against OpenFAST + qualified DISCON
  V3_pitch_steps:
    plant: 'configuration O8 of spec_E3 (amendment 4): FAST_SFunc with PCMode 4 and VSContrl 4, DISCON b9229079 called at every DT by the wrapper of spec_E3 campaign.depends_on.wrapper with the measured BldPitch1, InterpOrder 2, NumCrctn 1 in the .fst copy; 6 runs: steady wind 14, 18 and 22 m/s, override to beta_eq + 1 deg and to beta_eq - 1 deg (amendment 6)'
    steady_wind: 'copy of the InflowWind file of the case (NRELOffshrBsline5MW_InflowWind_12mps.dat): WindType 3 -> 1 and HWindSpeed 0 -> U (14, 18 or 22), old values checked; RefHt 90 m and PLExp 0.2 of that file unchanged (amendment 6)'
    initial_conditions: 'ElastoDyn copy: BlPitch(1), BlPitch(2), BlPitch(3) 0 -> beta_eq_deg of results/Q1-E1-AEROMAP-2026-10-08-a/analyse/C3_C4_par_vent.csv (SHA-256 46bcc04149a2fbfbbc95cd3c11b5a7a3acc4b96b0cd21011be5ceeb871be671e) at U, written with four decimals (14 m/s 8.5723, 18 m/s 14.9124, 22 m/s 19.8512 deg), old value checked, as spec_E3 E3b_region3_qualification.runs; RotSpeed 12.1 rpm of the model unchanged (amendment 6)'
    maneuver: 'ServoDyn copy: TPitManS(1-3) 9999.9 -> 60 s, PitManRat(1-3) 2 -> 8 deg/s, BlPitchF(1-3) 0 -> beta_eq_deg(U) + 1 or - 1 deg written with four decimals (14 m/s 9.5723 or 7.5723, 18 m/s 15.9124 or 13.9124, 22 m/s 20.8512 or 18.8512 deg), old values checked; the override applies whatever PCMode (ServoDyn.f90 l.5402-5420, OpenFAST v4.2.1); TMax = 70 s (amendment 6)'
    compare: 'RotSpeed (omega_r) from 60 to 70 s; the model is initialised at t = 60 s with omega_r = RotSpeed(60 s) and omega_f rebuilt at every output step from t = 0 from GenSpeed (rad/s) with the DISCON filter (GenSpeedF = (1 - Alpha) x GenSpeed + Alpha x GenSpeedF, Alpha = exp(-DT x 1.570796), initial GenSpeedF = first GenSpeed; DISCON.F90 l.58, l.303, l.355, l.360); it is driven by BldPitch1 and Wind1VelX of the run, each held over one Ts = 0.05 s at its value at the start of the step, and compared at the instants 60 + k x Ts (amendment 6)'
    pass: "e_max(omega_r) over the first 1.5 s <= 2 % of rated rotor speed  # adopted 15/10/2026; 10-s window reported only"
    outputs_added: "AeroDyn OutList of the V3 runs only: RtVAvgxh, RtAeroPwr, RtAeroCp, RtArea, RtTSR (output channels only, no physics change); ratio RtVAvgxh / Wind1VelX reported"
    variant_rule: "wind variants (i) and (ii) both evaluated; the variant with the lower sum over the 6 steps of e_max(omega_r) in the first 1.5 s is retained for V4 and E6; V4 is evaluated with the retained variant only"
    reported_only: 'per run: realised step BlPitchF - BldPitch1(60 s), max |BldPitch1(t) - BldPitch1(60 s)| over 50-60 s, RotSpeed change at 61.5 s and at 70 s relative to RotSpeed(60 s) (amendment 6)'
    V3b_model_v2: 'model v2 (amendment 7), campaign Q1-E2-V3-<date>-b: offline replay of the 6 runs of Q1-E2-V3-2026-10-22-a, no OpenFAST run, .outb SHA-256 U14_up a0718d8db1664bb2cda652bd26e0431b16a79db31a2651834050a554128f67b8, U14_dn 0d104df5f0c3d91a9c4d56301404ef44543577701bf83ed9778ea768ba3db235, U18_up ba2e3917e08922a94c6d1a4a613f91938a1b784af66b8acae5faca471063dff6, U18_dn a96f1ccab3a4f6f0673566ecb8e3db78bfa9a22e15491b38a1d034ae4c0d1fd0, U22_up 9dacea0820ac4a7a9ce3fa769ea10bda6071c0f4e7fe2f0db7679fd4590f5dd1, U22_dn 4abc752203580138bb9d8d997a6f4dc6f02b18dff0a38810eaf0f8d70cf17d74; compare as V3 compare with V = RtVAvgxh held over each Ts, variant (i) only (no variant rule); pass as V3 pass for each of the 6 runs; reported as V3 reported_only'
  V4_turbulent_segments:
    data: 'the 21 runs of Q1-E3-QUAL-2026-10-22-d (repetition excluded, seeds 31001-31003 reserved for E3 and E2 V4 by spec_E3 seeds), configuration O8 with initial pitch beta_eq, only t >= 60 s (spec_E3 duration), all 7 mean speeds evaluated and reported per speed (amendment 6)'
    protocol: 'consecutive non-overlapping segments of length T_H = 1.5 s from t = 60 s; at the start of each segment the model is re-initialised on the OpenFAST state (omega_r = RotSpeed, omega_f rebuilt as in V3 compare); inputs: BldPitch1 held over each Ts = 0.05 s at its value at the start of the step; wind either (a) Wind1VelX held over each Ts in the same way, or (b) Wind1VelX at the start of the segment held over the whole segment; comparison at the instants k x Ts of the segment; (a) measures the model error, (b) adds the wind-assumption error (amendment 6)'
    metrics: "RMSE, MAE, e_max, bias of omega_r, per wind speed; median and P95 over segments"
    pass: "(a) median e_max <= 2 % and P95 e_max <= 5 % of rated rotor speed  # adopted 15/10/2026; (b) reported only"
    V4b_data_model_v2: 'model v2 (amendment 7), campaign Q1-E2-V4DATA-<date>-a: 21 new runs on configuration O8 as spec_E3 E3b_region3_qualification (wind_generation, mean_speeds, duration, runs with initial pitch beta_eq, NumCrctn 1, TMax 660 s), with RandSeed1 in {32001, 32002, 32003} (project choice, no external source), reserved for E2 V4-b and excluded from E4; RtVAvgxh in the OutList; a run failing spec_E3 Q2 or Q2b is excluded and its mean speed is reported as not evaluated; spec_E3 Q3 and Q4 reported only'
    V4b_model_v2: 'model v2 (amendment 7), campaign Q1-E2-V4-<date>-b: offline on the 21 runs of V4b_data_model_v2, same data window, segments, protocol, metrics and pass as V4, same rules R1 to R5 as run_E2_V4.m and analyse_E2_V4.m at commit c65b3b6, with V = RtVAvgxh, variant (i): (a) held over each Ts, (b) value at the segment start held over the segment'
  exit_decision: 'model v1: NO-GO (Q1-E2-V4-2026-10-22-a). Model v2 (amendment 7): GO if V0-V2 (Q1-E2-ROM-2026-10-16-b, valid for model v2: equations, parameters and Cp table unchanged), V3-b and V4-b pass; GO WITH CONDITIONS if V4-b (a) fails only at listed speeds and passes at least one (domain restricted, stated in paper); NO-GO otherwise'

order_of_work:
  1: "adopt this spec; commit spec + model code + verification scripts (before execution)"
  2: "run V0-V2 (no OpenFAST)"
  3: "exploratory Simulink feasibility test (separate short spec; no publishable value)"
  4: "E3: plant-equivalence test (exe+DISCON vs S-function replay) and region-3 qualification of DISCON"
  5: "run V3-V4; exit decision"
  6: 'model v2 (amendment 7): V3-b offline, V4-b data runs (seeds 32001-32003), V4-b offline, exit decision'

forbidden_wordings:
  - '"validated" for the model before V3 and V4 pass'
  - "real time"
  - '"the pitch regulates power" (region 3: power is held by the torque law)'
  - 'the rotor-effective wind is measured (RtVAvgxh is computed by AeroDyn and assumed known: idealisation)'
  - 'model v2 is validated on E3b-d (DIAGV4 is exploratory and was used to choose the input)'

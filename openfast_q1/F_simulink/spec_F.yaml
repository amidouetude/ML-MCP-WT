# Feasibility spec - NMPC in the loop with OpenFAST through the Simulink S-function
# STATUS: ADOPTED by the author on 16/10/2026 (supervisor proposal of 16/10/2026).
# AMENDMENT 1, 16/10/2026: S-function electrical-power input and pitch units added; per-call timing by offline replay (the Nonlinear MPC block gives no per-call time).
# AMENDMENT 2, 16/10/2026: in attempt Q1-F-SIMULINK-2026-10-16-b the in-run replay failed (logged x of size [2 1 N]); the per-call timing is obtained by a separate analysis of the logs of that attempt (no new simulation), with replay-fidelity classes fixed before execution.
# EXPLORATORY: no value from this test enters the registry, the manuscript or any comparison.
# Its only use is the architecture decision for E6 (spec E2 order_of_work item 3).
# Rule: this spec and the test code are committed BEFORE execution; criteria cannot be
# changed after results are seen; corrections by dated amendment in a separate commit.

campaign:
  id: Q1-F-SIMULINK-<execution date>-a
  step: F (feasibility, between E2 verification and E3)
  purpose: >
    Establish whether OpenFAST v4.2.1 (FAST_SFunc, single precision) can be driven in closed
    loop by the MATLAB R2024a Nonlinear MPC Controller block, first with the E2 physics model,
    then with a dlnetwork-based state function, and record the computational cost per call.
  depends_on:
    E2: "spec openfast_q1/E2/spec_E2.yaml sha256 3acfba38...; verification Q1-E2-ROM-2026-10-16-b SATISFIED (V0-V2)"
    binaries: "C:/dev/openfast-bin: FAST_SFunc.mexw64 sha256 16b628c4..., OpenFAST-Simulink_x64.dll sha256 2d61ae5e..."

plant:
  base_case: "openfast_q1/model/5MW_Land_DLL_WTurb (model commit 7232a48), copied into the results folder"
  changes_in_copy_only:
    - "ServoDyn: PCMode = 4, VSContrl = 4 (commands from Simulink); nothing else"
    - "InflowWind: steady wind, HWindSpeed = 18 m/s, power-law exponent as in the r-test steady files"
    - "fst: TMax = 30 s; DT unchanged (0.00625 s)"
    - "AeroDyn OutList: add RtVAvgxh, RtAeroPwr, RtAeroCp (output channels only)"
  fingerprints: "SHA-256 of every file of the copied case recorded before the run"

controller:
  torque: >
    Jonkman torque law of the E2 model (rom_torque_law.m, model.equations.generator_torque),
    driven by a discrete first-order filter of GenSpeed (CornerFreq of DISCON.F90), evaluated
    at the OpenFAST step DT; output GenTq to the S-function
  electrical_power: 'S-function input 2 (VSContrl = 4): P_e = 0.944 * Q_g * omega_g, as in E2 model.equations.electrical_power (amendment 1)'
  pitch_units: 'S-function inputs 5-7 are blade pitch commands in rad (FAST_Library.h l.72-83); the NMPC MV is in deg (E2 model.inputs.beta); the collective command is converted deg to rad and sent to the three blades (amendment 1)'
  pitch: >
    Nonlinear MPC Controller block, sample time nmpc_interface.Ts (0.05 s), prediction horizon
    30 steps (1.5 s, nmpc_interface.horizon), control horizon 5 (provisional, feasibility only),
    MV beta with bounds and rate of nmpc_interface.constraints, output = collective BlPitchCom
  wind_to_controller: "Wind1VelX at time k held over the horizon (nmpc_interface.wind_assumption)"
  weights: "provisional, written in the test code with the comment 'feasibility only, not tuned'"
  state_estimate: "measured RotSpeed (rad/s) and the filtered GenSpeed; no estimator"

cases:
  F1_openloop_sfunction:
    what: "S-function with constant BlPitchCom = 15 deg and the torque law above, 30 s"
    pass: "runs to TMax without error; outputs finite"
  F2_nmpc_physics:
    what: "closed loop, NMPC with a lean wrapper of rom_step (no diagnostic structures), 30 s"
    pass: >
      runs to TMax without error; outputs finite; RotSpeed in [0.8, 1.2] x 12.1 rpm over the
      last 15 s (loop closed, not a performance criterion)
    record: "solver exit flag of every call; wall time per NMPC call (median, P95, P99, max); total wall time"
    timing_method: 'The block gives no per-call time (R2024a nmpcblock_MaskInitFcn.m l.38, nmpcblock_interface.m l.1). In the loop: ExitFlag of every call (nlp.status output) and total wall time. Per-call time: the block inputs are logged at every Ts (state, last MV, measured disturbance) and the same calls are replayed once each, in the same order and with the same warm-start chain, by nlmpcmove on the same nlmpc object, each timed by tic/toc. Replay fidelity reported as max |MV_replay - MV_block|. Limitation written in the verdict: Simulink overhead not included (amendment 1)'
    offline_replay: 'Analysis script replay_from_logs_F.m on results/Q1-F-SIMULINK-2026-10-16-b/F2/logs.mat and F3/logs.mat (sha256 checked); state reshaped from [2 1 N] to [N 2] before replay_timing_F.m (unchanged); nlmpc object rebuilt by make_nlobj.m, textually identical to make_nlobj of run_F.m at commit d472f58; statistics over all calls and without the first call (amendment 2)'
    fidelity_classes: 'REPRODUCED if MV_replay equals MV_block bit for bit at every call; CONSISTENT if max |MV_replay - MV_block| <= 1e-6 deg; NOT REPRODUCED otherwise, in which case the times describe nlmpcmove alone and not the block (amendment 2)'
  F3_nmpc_dlnetwork:
    what: >
      same as F2 for 5 s, with a state function built on an UNTRAINED dlnetwork (fixed
      architecture: 3 inputs, 2 hidden layers of 32 tanh units, 2 outputs; weights from rng(1));
      tests only that the block can call predict() and its cost
    pass: "runs 5 s without error"
    record: "same timing as F2; precision of predict() output (single or double)"
    timing_method: 'as F2 (amendment 1)'
  execution_modes: "interpreted simulation; MEX acceleration of the block attempted once per case and reported (success or error message), never required"

outputs:
  folder: "results/Q1-F-SIMULINK-<date>-a/"
  files: "meta_F.txt (commit, script and input SHA-256, binaries, MATLAB version, machine), verdict_F.txt, .outb of each case, timing CSV"
  verdict_values: "PASS / FAIL per case, plus the recorded quantities; overall FEASIBLE / NOT FEASIBLE / FEASIBLE WITH LIMITS"

forbidden_wordings:
  - "real time"
  - '"the NMPC performs better / worse" (no performance comparison in this test)'
  - '"validated"'
  - "any timing figure presented as representative of E8"
